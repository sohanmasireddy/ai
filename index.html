<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141b">
  <title>GOD AI</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.72);
      --glass-frost: .10;
      --glass-saturation: 1.2;
      --filter-id: url(#glass-filter-_r_b_);
      --side: clamp(13px, 3vw, 38px);
      --wallpaper: url("./city.png");
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html { background: #111923; }
    body {
      color: var(--ink);
      background: transparent;
      font: 15px/1.58 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* Fixed photo backdrop. The image itself is bundled beside index.html. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(180deg, rgba(6,11,18,.15) 0%, rgba(6,11,18,.23) 42%, rgba(6,11,18,.44) 100%),
        var(--wallpaper),
        linear-gradient(135deg, #12324c, #101923 75%);
      background-size: cover, cover, cover;
      background-position: center, center, center;
      background-repeat: no-repeat;
      transform: scale(1.008);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 18%, rgba(0,0,0,.13) 100%);
    }
    .app {
      position: relative;
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      padding: 0 var(--side) max(14px, env(safe-area-inset-bottom));
      isolation: isolate;
    }
    .conversation {
      min-height: 0;
      overflow: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.3) transparent;
      padding: max(22px, env(safe-area-inset-top)) 0 23px;
      scroll-behavior: smooth;
    }
    .conversation::-webkit-scrollbar { width: 6px; }
    .conversation::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); border-radius: 8px; }
    .messages {
      width: min(100%, 900px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .message { min-width: 0; max-width: 100%; overflow-wrap: anywhere; animation: enter .2s ease-out both; }
    .message.user { align-self: flex-end; max-width: min(82%, 690px); }
    .message.assistant { align-self: stretch; max-width: 100%; }
    .message-body { min-width: 0; }
    .user .message-body {
      padding: 11px 16px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 19px 19px 5px 19px;
      background: rgba(12,20,29,.28);
      box-shadow: inset 0 1px rgba(255,255,255,.16), 0 10px 28px rgba(0,0,0,.08);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      backdrop-filter: blur(18px) saturate(135%);
      white-space: pre-wrap;
    }
    .assistant .message-body { padding: 1px 4px; text-shadow: 0 1px 10px rgba(0,0,0,.20); }
    .message-body p { margin: 0 0 12px; }
    .message-body p:last-child { margin-bottom: 0; }
    .message-body h1, .message-body h2, .message-body h3, .message-body h4 {
      line-height: 1.3; margin: 18px 0 9px; font-weight: 650; letter-spacing: -.025em;
    }
    .message-body h1 { font-size: 1.45rem; }
    .message-body h2 { font-size: 1.25rem; }
    .message-body h3, .message-body h4 { font-size: 1.08rem; }
    .message-body ul, .message-body ol { padding-left: 24px; margin: 9px 0 14px; }
    .message-body li { margin: 4px 0; padding-left: 2px; }
    .message-body blockquote { margin: 10px 0; padding: 2px 0 2px 14px; border-left: 2px solid rgba(255,255,255,.54); color: rgba(255,255,255,.82); }
    .message-body a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.6); text-underline-offset: 3px; }
    .message-body code { font: .9em/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .message-body :not(pre) > code { padding: 2px 5px; background: rgba(2,9,16,.42); border: 1px solid rgba(255,255,255,.15); border-radius: 5px; }
    .message-body pre { max-width: 100%; overflow-x: auto; margin: 12px 0 15px; padding: 14px 15px; white-space: pre; background: rgba(5,11,18,.68); border: 1px solid rgba(255,255,255,.20); border-radius: 13px; }
    .message-body pre code { padding: 0; border: 0; background: transparent; }
    .message-body hr { border: 0; border-top: 1px solid rgba(255,255,255,.28); margin: 18px 0; }
    .typing { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 2px; }
    .typing span { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.85); animation: pulse 1.05s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .13s; }
    .typing span:nth-child(3) { animation-delay: .26s; }
    .brand {
      justify-self: center;
      margin: 6px 0 13px;
      padding-left: .20em;
      font-size: clamp(18px, 2.2vw, 23px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: .20em;
      text-shadow: 0 2px 24px rgba(0,0,0,.32);
      user-select: none;
    }
    .composer-wrap { width: min(100%, 900px); justify-self: center; }
    .composer {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 9px;
      width: 100%;
      min-height: 65px;
      padding: 9px;
      border: 0;
      border-radius: 28px;
      background: rgba(7,14,22,.16);
      box-shadow: 0 16px 48px rgba(0,0,0,.24);
      isolation: isolate;
    }
    /* Adapted from your Liquid Glass .liquidglass snippet: the glass is one
       continuous surface behind the textarea/button, so there is no blue box. */
    .liquidglass {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      background: hsl(0 0% 0% / var(--glass-frost, .1));
      -webkit-backdrop-filter: var(--filter-id, url(#glass-filter-_r_b_)) saturate(var(--glass-saturation, 1.2)) blur(22px);
      backdrop-filter: var(--filter-id, url(#glass-filter-_r_b_)) saturate(var(--glass-saturation, 1.2)) blur(22px);
      box-shadow:
        inset 0 0 2px 1px rgba(255,255,255,.34),
        inset 0 0 10px 4px rgba(255,255,255,.13),
        inset 0 4px 16px rgba(6,13,21,.05),
        inset 0 8px 24px rgba(6,13,21,.05),
        inset 0 6px 56px rgba(6,13,21,.05),
        0 1px 0 rgba(255,255,255,.08);
    }
    .glass-surface__filter { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; z-index: -1; pointer-events: none; }
    .composer textarea {
      display: block;
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 45px;
      max-height: 180px;
      overflow-y: auto;
      resize: none;
      border: 0 !important;
      outline: none !important;
      box-shadow: none !important;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
      padding: 11px 12px 10px;
      margin: 0;
      background: transparent !important;
      color: var(--ink);
      caret-color: white;
      font: inherit;
      line-height: 1.45;
    }
    .composer textarea::placeholder { color: rgba(255,255,255,.83); }
    .composer textarea:focus, .composer textarea:focus-visible { border: 0 !important; outline: none !important; box-shadow: none !important; }
    .send {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      min-width: 73px;
      height: 45px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 19px;
      background: rgba(255,255,255,.17);
      color: #fff;
      font: 560 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: inset 0 1px rgba(255,255,255,.22), 0 3px 10px rgba(0,0,0,.09);
      transition: background .18s ease, transform .18s ease, opacity .18s ease;
    }
    .send:hover:not(:disabled) { background: rgba(255,255,255,.26); }
    .send:active:not(:disabled) { transform: scale(.975); }
    .send:disabled { opacity: .46; cursor: default; }
    .status {
      min-height: 18px;
      margin: 7px 8px 0;
      color: rgba(255,255,255,.93);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
      text-shadow: 0 1px 8px rgba(0,0,0,.55);
    }
    .status:empty { visibility: hidden; }
    :focus-visible { outline: 2px solid rgba(255,255,255,.95); outline-offset: 4px; }
    /* Keep the supplied SVG displacement filter where supported, while
       preserving a readable, softly blurred glass fallback on all browsers. */
    @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
      .liquidglass { background: rgba(16,25,35,.89); }
      .user .message-body { background: rgba(16,25,35,.88); }
    }
    @media (max-width: 560px) {
      :root { --side: 10px; }
      .app { padding-bottom: max(9px, env(safe-area-inset-bottom)); }
      .conversation { padding-top: max(17px, env(safe-area-inset-top)); padding-bottom: 17px; }
      .messages { gap: 19px; }
      .message.user { max-width: 91%; }
      .composer { gap: 4px; padding: 7px; border-radius: 24px; }
      .composer textarea { padding-left: 8px; padding-right: 4px; }
      .send { min-width: 63px; padding: 0 12px; height: 43px; }
      .brand { margin-bottom: 10px; }
    }
    @media (max-height: 500px) {
      .conversation { padding-top: 12px; }
      .brand { margin: 3px 0 7px; }
      .composer textarea { max-height: 100px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    'use strict';

    // Official Ollama Cloud API endpoint and cloud-specific model tag.
    const OLLAMA_ENDPOINT = 'https://ollama.com/api/chat';
    const OLLAMA_MODEL = 'nemotron-3-nano:30b-cloud';
    const SYSTEM_PROMPT = 'You are GOD AI, a helpful, careful, and accurate assistant. Be clear and useful; never claim to have done something you have not done.';

    const conversation = document.getElementById('conversation');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const promptEl = document.getElementById('prompt');
    const sendButton = document.getElementById('sendButton');
    const statusEl = document.getElementById('status');

    let busy = false;
    let history = [];
    let sessionKey = '';

    function setStatus(message = '') { statusEl.textContent = message; }

    function getConfiguredKey() {
      const value = window.GOD_AI_SECRETS && window.GOD_AI_SECRETS.OLLAMA_API_KEY;
      return typeof value === 'string' && !value.includes('PASTE_YOUR_OLLAMA_API_KEY_HERE')
        ? value.trim() : '';
    }

    function escapeHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function safeHref(value) {
      const decoded = String(value).replace(/&amp;/g, '&').trim();
      try {
        const parsed = new URL(decoded);
        if (!['https:', 'http:', 'mailto:'].includes(parsed.protocol)) return null;
        return escapeHtml(decoded);
      } catch { return null; }
    }

    // Small safe Markdown renderer: model output is escaped before formatting;
    // arbitrary HTML/script from the model is never evaluated or injected as HTML.
    function renderMarkdown(markdown) {
      const blocks = [];
      let text = String(markdown).replace(/```([^\n`]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const language = lang.trim().replace(/[^\w+-]/g, '');
        const idx = blocks.push('<pre><code' + (language ? ' class="language-' + escapeHtml(language) + '"' : '') + '>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>') - 1;
        return '\uE100BLOCK' + idx + '\uE101';
      });
      text = escapeHtml(text);
      const inline = [];
      text = text.replace(/`([^`\n]+)`/g, (_, code) => {
        const idx = inline.push('<code>' + code + '</code>') - 1;
        return '\uE100INLINE' + idx + '\uE101';
      });
      text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (all, label, href) => {
        const safe = safeHref(href);
        return safe ? '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : label;
      });
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/__(.+?)__/g, '<strong>$1</strong>')
        .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
        .replace(/(?<!_)_([^_\n]+)_(?!_)/g, '<em>$1</em>');

      const lines = text.split('\n');
      const out = [];
      let paragraph = [];
      let listType = '';
      const flushParagraph = () => { if (paragraph.length) { out.push('<p>' + paragraph.join('<br>') + '</p>'); paragraph = []; } };
      const closeList = () => { if (listType) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); listType = ''; } };
      for (const line of lines) {
        const trim = line.trim();
        const heading = /^(#{1,4})\s+(.+)$/.exec(trim);
        const bullet = /^[-*+]\s+(.+)$/.exec(trim);
        const numbered = /^\d+[.)]\s+(.+)$/.exec(trim);
        if (!trim) { flushParagraph(); closeList(); continue; }
        if (/^\uE100BLOCK\d+\uE101$/.test(trim)) { flushParagraph(); closeList(); out.push(trim); continue; }
        if (heading) { flushParagraph(); closeList(); const n = heading[1].length; out.push('<h' + n + '>' + heading[2] + '</h' + n + '>'); continue; }
        if (/^(---+|___+|\*\*\*+)$/.test(trim)) { flushParagraph(); closeList(); out.push('<hr>'); continue; }
        if (/^&gt;\s?/.test(trim)) { flushParagraph(); closeList(); out.push('<blockquote>' + trim.replace(/^&gt;\s?/, '') + '</blockquote>'); continue; }
        if (bullet || numbered) {
          flushParagraph(); const wanted = bullet ? 'ul' : 'ol';
          if (listType !== wanted) { closeList(); out.push(wanted === 'ul' ? '<ul>' : '<ol>'); listType = wanted; }
          out.push('<li>' + (bullet ? bullet[1] : numbered[1]) + '</li>'); continue;
        }
        closeList(); paragraph.push(trim);
      }
      flushParagraph(); closeList();
      return out.join('')
        .replace(/\uE100BLOCK(\d+)\uE101/g, (_, i) => blocks[Number(i)] || '')
        .replace(/\uE100INLINE(\d+)\uE101/g, (_, i) => inline[Number(i)] || '');
    }

    function scrollToLatest(force = false) {
      const gap = conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight;
      if (force || gap < 170) conversation.scrollTop = conversation.scrollHeight;
    }

    function addUserMessage(text) {
      const article = document.createElement('article');
      article.className = 'message user';
      article.setAttribute('aria-label', 'You');
      const body = document.createElement('div');
      body.className = 'message-body';
      body.textContent = text;
      article.appendChild(body); messagesEl.appendChild(article); scrollToLatest(true);
    }

    function addAssistantMessage() {
      const article = document.createElement('article');
      article.className = 'message assistant';
      article.setAttribute('aria-label', 'GOD AI');
      const body = document.createElement('div'); body.className = 'message-body';
      const typing = document.createElement('span'); typing.className = 'typing';
      typing.setAttribute('aria-label', 'Generating response');
      typing.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(typing); article.appendChild(body); messagesEl.appendChild(article);
      scrollToLatest(true); return { article, body, typing };
    }

    function errorText(error, status) {
      if (status === 401 || status === 403) return 'Ollama rejected this API key or the account lacks access. Check secrets.js and your Ollama API access.';
      if (status === 429) return 'Ollama usage/rate limit reached. Try again later and check your account limits.';
      if (status === 404) return 'Ollama could not find the endpoint or model. Check the model tag in index.html.';
      if (error instanceof TypeError) return 'The browser could not reach Ollama Cloud. Check your connection; CORS may block direct browser requests. A public website needs a server-side proxy to avoid exposing the key.';
      const detail = error && error.message ? error.message : 'Unknown request error.';
      return 'Ollama request failed: ' + detail.slice(0, 450);
    }

    async function sendMessage() {
      if (busy) return;
      const content = promptEl.value.trim();
      if (!content) { setStatus('Type a message first.'); promptEl.focus(); return; }
      const apiKey = sessionKey || getConfiguredKey();
      if (!apiKey) {
        setStatus('Add your Ollama API key to secrets.js, save the file, then reload GOD AI.');
        return;
      }

      busy = true; sendButton.disabled = true; promptEl.disabled = true; setStatus('');
      promptEl.value = ''; resizePrompt();
      addUserMessage(content);
      const assistant = addAssistantMessage();
      const userTurn = { role: 'user', content };
      let answer = '';
      let statusCode = 0;

      try {
        const response = await fetch(OLLAMA_ENDPOINT, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json',
            'Accept': 'application/x-ndjson, application/json'
          },
          body: JSON.stringify({
            model: OLLAMA_MODEL,
            messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history, userTurn],
            stream: true
          })
        });
        statusCode = response.status;
        if (!response.ok) {
          const detail = (await response.text()).slice(0, 700);
          const error = new Error(detail || ('HTTP ' + response.status));
          error.status = response.status;
          throw error;
        }
        if (!response.body || !response.body.getReader) {
          const result = await response.json();
          answer = result && result.message && result.message.content || '';
        } else {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let pending = '';
          const consume = line => {
            const row = line.trim(); if (!row) return;
            let part;
            try { part = JSON.parse(row); }
            catch { throw new Error('Ollama returned an invalid streaming response.'); }
            if (part.error) throw new Error(String(part.error));
            const delta = part.message && typeof part.message.content === 'string' ? part.message.content : '';
            if (delta) {
              answer += delta;
              if (assistant.typing.isConnected) assistant.typing.remove();
              assistant.body.innerHTML = renderMarkdown(answer);
              scrollToLatest();
            }
          };
          while (true) {
            const { value, done } = await reader.read();
            pending += decoder.decode(value || new Uint8Array(), { stream: !done });
            const lines = pending.split('\n'); pending = lines.pop() || '';
            for (const line of lines) consume(line);
            if (done) break;
          }
          if (pending.trim()) consume(pending);
        }

        if (!answer.trim()) throw new Error('The API completed but returned no text.');
        if (assistant.typing.isConnected) assistant.typing.remove();
        assistant.body.innerHTML = renderMarkdown(answer);
        history.push(userTurn, { role: 'assistant', content: answer });
        scrollToLatest(true);
      } catch (error) {
        assistant.article.remove();
        setStatus(errorText(error, error.status || statusCode));
        console.error('GOD AI request failed:', error);
      } finally {
        busy = false; sendButton.disabled = false; promptEl.disabled = false; promptEl.focus();
      }
    }

    chatForm.addEventListener('submit', event => { event.preventDefault(); sendMessage(); });
    promptEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault(); chatForm.requestSubmit();
      }
    });
    promptEl.addEventListener('input', resizePrompt);
    function resizePrompt() {
      promptEl.style.height = 'auto';
      promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + 'px';
    }

    document.addEventListener('keydown', event => {
      if (!event.altKey || !event.shiftKey || event.ctrlKey || event.metaKey) return;
      if (event.key.toLowerCase() === 'x') {
        event.preventDefault();
        if (busy) { setStatus('Wait for the current answer to finish before clearing the chat.'); return; }
        if (messagesEl.childElementCount && window.confirm('Clear this conversation?')) {
          messagesEl.replaceChildren(); history = []; setStatus('');
        }
      }
      if (event.key.toLowerCase() === 'k') {
        event.preventDefault();
        const entered = window.prompt('Enter a temporary Ollama API key for this tab. It will not be saved to secrets.js:');
        if (entered && entered.trim()) { sessionKey = entered.trim(); setStatus('Temporary key set for this tab.'); }
      }
    });
  </script>
</body>
</html>
