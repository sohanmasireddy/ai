<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141b">
<title>SM's AI</title>
<style>
:root{color-scheme:dark;--ink:rgba(255,255,255,.97);--side:clamp(12px,3vw,38px)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111923}
body{color:var(--ink);font:15px/1.58 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
.nogpu #gl{display:none}
.nogpu body{background:#111923 url(./city.png) center/cover}
.nogpu .glass{background:rgba(10,18,28,.42);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3)}
.app{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:0 var(--side) max(14px,env(safe-area-inset-bottom))}
.conversation{min-height:0;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:max(22px,env(safe-area-inset-top)) 0 22px}
.conversation::-webkit-scrollbar{display:none}
.messages{width:min(100%,900px);margin:0 auto;display:flex;flex-direction:column;gap:18px}
.message{max-width:100%;overflow-wrap:anywhere;animation:enter .35s cubic-bezier(.2,.8,.2,1) both}
.message.user{align-self:flex-end;max-width:min(82%,690px)}
.message.assistant{align-self:stretch}
.message-body{padding:12px 18px;border-radius:22px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.user .message-body{white-space:pre-wrap}
.message-body p{margin:0 0 12px}.message-body p:last-child{margin:0}
.message-body h1,.message-body h2,.message-body h3,.message-body h4{line-height:1.3;margin:14px 0 8px;font-weight:650}
.message-body ul,.message-body ol{padding-left:24px;margin:8px 0 12px}
.message-body blockquote{margin:10px 0;padding-left:14px;border-left:2px solid rgba(255,255,255,.5)}
.message-body a{color:#fff;text-underline-offset:3px}
.message-body code{font:.9em/1.55 ui-monospace,Consolas,monospace}
.message-body :not(pre)>code{padding:2px 5px;background:rgba(0,0,0,.35);border-radius:5px}
.message-body pre{overflow-x:auto;margin:12px 0;padding:14px;background:rgba(0,0,0,.5);border-radius:13px}
.message-body hr{border:0;border-top:1px solid rgba(255,255,255,.28)}
.typing{display:inline-flex;gap:5px;height:24px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.13s}.typing span:nth-child(3){animation-delay:.26s}
.welcome-layer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
.welcome{text-align:center;padding:34px clamp(26px,6vw,56px);border-radius:36px;max-width:560px;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);text-shadow:0 2px 16px rgba(0,0,0,.35)}
.welcome.hide{opacity:0;transform:scale(.94) translateY(-14px)}
.welcome h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px);letter-spacing:-.03em;line-height:1.15;font-weight:650}
.welcome p{margin:0;color:rgba(255,255,255,.82);font-size:16px}
.composer-wrap{width:min(100%,900px);justify-self:center}
.composer{display:flex;align-items:flex-end;gap:9px;min-height:66px;padding:10px;border-radius:30px}
.composer textarea{flex:1;min-width:0;min-height:46px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);caret-color:#fff;font:inherit;line-height:1.45;padding:11px 12px}
.composer textarea::placeholder{color:rgba(255,255,255,.8)}
.send{height:46px;min-width:74px;padding:0 16px;border:1px solid rgba(255,255,255,.3);border-radius:20px;background:rgba(255,255,255,.16);color:#fff;font:560 14px/1 inherit;cursor:pointer;transition:background .2s,transform .2s,opacity .2s}
.send:hover:not(:disabled){background:rgba(255,255,255,.28)}.send:active:not(:disabled){transform:scale(.96)}.send:disabled{opacity:.45}
.status{min-height:18px;margin:7px 8px 0;font-size:12px;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.status:empty{visibility:hidden}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes pulse{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="welcome-layer"><div id="welcome" class="welcome glass"><h1>Hello there.</h1><p>Ask anything, think out loud, or start something new.</p></div></div>
<div class="app">
  <main id="conversation" class="conversation" aria-label="Conversation"><div id="messages" class="messages"></div></main>
  <div class="composer-wrap">
    <form id="chatForm" class="composer glass" autocomplete="off">
      <textarea id="prompt" rows="1" aria-label="Message" placeholder="Message…" enterkeyhint="send" required></textarea>
      <button id="sendButton" class="send" type="submit">Send</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>
</div>

<script src="./secrets.js"></script>
<script>
'use strict';
/* ---------- WebGPU liquid glass: all glass is computed in a WGSL compute shader ---------- */
const MAXP = 32;
const WGSL = /* wgsl */`
struct U { res: vec2f, img: vec2f, time: f32, count: u32, dpr: f32, pad: f32 };
struct P { r: vec4f, q: vec4f, c: vec4f };  // r=x,y,w,h  q=radius,bevel,strength,alpha  c=clip x0,y0,x1,y1
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read> ps: array<P, ${MAXP}>;
@group(0) @binding(2) var bg: texture_2d<f32>;
@group(0) @binding(3) var smp: sampler;
@group(0) @binding(4) var out: texture_storage_2d<rgba8unorm, write>;

fn cover(p: vec2f) -> vec2f {
  let s = max(u.res.x / u.img.x, u.res.y / u.img.y);
  let size = u.img * s;
  return (p - (u.res - size) * 0.5) / size;
}
fn tap(p: vec2f) -> vec3f { return textureSampleLevel(bg, smp, cover(p), 0.0).rgb; }
fn blur(p: vec2f, rad: f32) -> vec3f {
  var a = tap(p) * 2.0;
  for (var i = 0; i < 6; i++) {
    let t = f32(i) * 1.0471976;
    a += tap(p + vec2f(cos(t), sin(t)) * rad);
  }
  return a / 8.0;
}
fn sdp(i: u32, p: vec2f) -> f32 {
  let a = ps[i];
  let h = a.r.zw * 0.5;
  let q = abs(p - (a.r.xy + h)) - h + a.q.x;
  return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0) - a.q.x;
}
fn inClip(i: u32, p: vec2f) -> bool {
  let c = ps[i].c;
  return p.x >= c.x && p.y >= c.y && p.x <= c.z && p.y <= c.w;
}

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= u32(u.res.x) || id.y >= u32(u.res.y)) { return; }
  let p = vec2f(id.xy) + 0.5;
  var col = tap(p);
  col *= 0.93 - 0.16 * smoothstep(0.35, 1.0, p.y / u.res.y);   // photo grade

  // soft drop shadows
  var sh = 0.0;
  var bi = -1;
  var best = 0.0;
  for (var i = 0u; i < u.count; i++) {
    if (!inClip(i, p)) { continue; }
    let al = ps[i].q.w;
    let so = sdp(i, p - vec2f(0.0, 10.0 * u.dpr));
    sh += 0.26 * al * exp(-max(so, 0.0) / (26.0 * u.dpr));
    let d = sdp(i, p);
    if (d < 1.0) { bi = i32(i); best = d; }
  }
  col *= 1.0 - min(sh, 0.4);

  if (bi >= 0) {
    let i = u32(bi);
    let a = ps[i];
    let e = 1.5;
    let n = normalize(vec2f(sdp(i, p + vec2f(e, 0.0)) - sdp(i, p - vec2f(e, 0.0)),
                            sdp(i, p + vec2f(0.0, e)) - sdp(i, p - vec2f(0.0, e))) + 1e-5);
    let depth = max(-best, 0.0);
    let t = 1.0 - clamp(depth / a.q.y, 0.0, 1.0);          // 1 at rim, 0 in the flat centre
    let bend = t * t * t * a.q.z;                          // convex bevel refraction
    let ctr = a.r.xy + a.r.zw * 0.5;
    let pos = ctr + (p - ctr) * 0.985 - n * bend;          // slight magnification + edge lens
    let ca = n * (t * t * 7.0 * u.dpr + 1.0);              // chromatic dispersion
    let rad = 5.0 * u.dpr;
    var g = vec3f(blur(pos + ca, rad).r, blur(pos, rad).g, blur(pos - ca, rad).b);

    // frost + tint (keeps white HTML text legible over bright sky)
    let lum = dot(g, vec3f(0.299, 0.587, 0.114));
    g = mix(vec3f(lum), g, 1.25) * 0.66 + vec3f(0.035, 0.05, 0.07);

    // specular rim light (top-left key, bottom-right fill) + moving sheen
    let L = normalize(vec2f(-0.7, -0.7));
    let key = pow(t, 3.0) * pow(max(dot(n, L), 0.0), 1.4);
    let fill = pow(t, 4.0) * pow(max(dot(n, -L), 0.0), 2.0) * 0.45;
    let hair = smoothstep(2.2 * u.dpr, 0.0, depth) * 0.32;
    let sheen = 0.035 * (0.5 + 0.5 * sin(u.time * 0.8 + (p.x - p.y) / (140.0 * u.dpr)));
    g += vec3f(key * 0.85 + fill + hair + sheen) * a.q.w;

    col = mix(col, g, clamp(1.0 - best, 0.0, 1.0) * a.q.w);   // anti-aliased edge * fade alpha
  }
  textureStore(out, id.xy, vec4f(col, 1.0));
}`;
const BLIT = /* wgsl */`
@group(0) @binding(0) var t: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
  return vec4f(p[i], 0, 1);
}
@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f { return textureLoad(t, vec2i(p.xy), 0); }`;

const canvas = document.getElementById('gl');
const conversation = document.getElementById('conversation');
let gpuFrame = null;

async function loadBackground() {
  try {
    const res = await fetch('./city.png');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await createImageBitmap(await res.blob());
  } catch (e) {
    console.warn('city.png failed to load:', e);
    setStatus("Couldn't load city.png. Put it next to index.html and open the page via http://localhost. Using a gradient for now.");
    const c = new OffscreenCanvas(1600, 900), x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 900);
    g.addColorStop(0, '#1d6fb8'); g.addColorStop(.6, '#cfe3f2'); g.addColorStop(1, '#c9b896');
    x.fillStyle = g; x.fillRect(0, 0, 1600, 900);
    return createImageBitmap(c);
  }
}

async function initGlass() {
  if (!navigator.gpu) throw new Error('WebGPU unavailable');
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('No GPU adapter');
  const dev = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device: dev, format: fmt, alphaMode: 'opaque' });

  const bmp = await loadBackground();
  const bgTex = dev.createTexture({ size: [bmp.width, bmp.height], format: 'rgba8unorm',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
  dev.queue.copyExternalImageToTexture({ source: bmp }, { texture: bgTex }, [bmp.width, bmp.height]);

  const cp = dev.createComputePipeline({ layout: 'auto', compute: { module: dev.createShaderModule({ code: WGSL }), entryPoint: 'main' } });
  const bm = dev.createShaderModule({ code: BLIT });
  const rp = dev.createRenderPipeline({ layout: 'auto', vertex: { module: bm, entryPoint: 'vs' },
    fragment: { module: bm, entryPoint: 'fs', targets: [{ format: fmt }] } });
  const smp = dev.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' });
  const uBuf = dev.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const pBuf = dev.createBuffer({ size: MAXP * 48, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const uAB = new ArrayBuffer(32), uF = new Float32Array(uAB), uU = new Uint32Array(uAB);
  const pF = new Float32Array(MAXP * 12);
  let outTex, cBind, rBind, W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.floor(innerWidth * dpr)), h = Math.max(1, Math.floor(innerHeight * dpr));
    if (w === W && h === H) return;
    W = canvas.width = w; H = canvas.height = h;
    if (outTex) outTex.destroy();
    outTex = dev.createTexture({ size: [W, H], format: 'rgba8unorm', usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING });
    const v = outTex.createView();
    cBind = dev.createBindGroup({ layout: cp.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: uBuf } }, { binding: 1, resource: { buffer: pBuf } },
      { binding: 2, resource: bgTex.createView() }, { binding: 3, resource: smp }, { binding: 4, resource: v }] });
    rBind = dev.createBindGroup({ layout: rp.getBindGroupLayout(0), entries: [{ binding: 0, resource: v }] });
  }
  resize(); addEventListener('resize', resize);

  function collect() {
    const k = W / innerWidth, cr = conversation.getBoundingClientRect();
    let n = 0;
    for (const el of document.querySelectorAll('.glass')) {
      if (n >= MAXP) break;
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      const al = parseFloat(cs.opacity);
      if (r.width < 2 || r.height < 2 || al < 0.01) continue;
      const inConv = conversation.contains(el);
      const x0 = inConv ? cr.left : 0, y0 = inConv ? cr.top : 0, x1 = inConv ? cr.right : innerWidth, y1 = inConv ? cr.bottom : innerHeight;
      if (r.bottom < y0 || r.top > y1) continue;
      const rad = Math.min((parseFloat(cs.borderTopLeftRadius) || 20) * k, Math.min(r.width, r.height) * k / 2);
      pF.set([r.left * k, r.top * k, r.width * k, r.height * k,
              rad, Math.min(18 * k, rad), 22 * k, al,
              x0 * k, y0 * k, x1 * k, y1 * k], n * 12);
      n++;
    }
    return n;
  }
  function frame(t) {
    resize();
    const n = collect();
    uF.set([W, H, bmp.width, bmp.height, t / 1000], 0); uU[5] = n; uF[6] = dpr;
    dev.queue.writeBuffer(uBuf, 0, uAB);
    dev.queue.writeBuffer(pBuf, 0, pF);
    const enc = dev.createCommandEncoder();
    const cpass = enc.beginComputePass();
    cpass.setPipeline(cp); cpass.setBindGroup(0, cBind);
    cpass.dispatchWorkgroups(Math.ceil(W / 8), Math.ceil(H / 8)); cpass.end();
    const rpass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    rpass.setPipeline(rp); rpass.setBindGroup(0, rBind); rpass.draw(3); rpass.end();
    dev.queue.submit([enc.finish()]);
    gpuFrame = requestAnimationFrame(frame);   // vsync-locked, runs at display refresh (60fps+)
  }
  gpuFrame = requestAnimationFrame(frame);
  dev.lost.then(() => { cancelAnimationFrame(gpuFrame); document.documentElement.classList.add('nogpu'); });
}
initGlass().catch(err => {
  console.warn('Liquid glass fallback:', err);
  document.documentElement.classList.add('nogpu');
  setStatus('WebGPU glass unavailable (' + (err.message || err) + '). If city.png fails to load, serve this folder over http://localhost.');
});

/* ---------- Chat (HTML text overlay, native textarea) ---------- */
const OLLAMA_ENDPOINT = 'https://ollama.com/api/chat';
const OLLAMA_MODEL = 'nemotron-3-nano:30b-cloud';
const SYSTEM_PROMPT = 'You are a helpful, careful, and accurate assistant. Be clear and useful; never claim to have done something you have not done.';
const messagesEl = document.getElementById('messages'), chatForm = document.getElementById('chatForm'),
  promptEl = document.getElementById('prompt'), sendButton = document.getElementById('sendButton'),
  statusEl = document.getElementById('status'), welcomeEl = document.getElementById('welcome');
let busy = false, history = [], sessionKey = '';

function setStatus(m = '') { statusEl.textContent = m; }
function getConfiguredKey() {
  const v = window.GOD_AI_SECRETS && window.GOD_AI_SECRETS.OLLAMA_API_KEY;
  return typeof v === 'string' && !v.includes('PASTE_YOUR_OLLAMA_API_KEY_HERE') ? v.trim() : '';
}
const escapeHtml = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function safeHref(v) {
  const d = String(v).replace(/&amp;/g, '&').trim();
  try { return ['https:', 'http:', 'mailto:'].includes(new URL(d).protocol) ? escapeHtml(d) : null; } catch { return null; }
}
function renderMarkdown(md) {
  const blocks = [], inline = [];
  let text = String(md).replace(/```([^\n`]*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const l = lang.trim().replace(/[^\w+-]/g, '');
    return '\uE100B' + (blocks.push('<pre><code' + (l ? ' class="language-' + escapeHtml(l) + '"' : '') + '>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>') - 1) + '\uE101';
  });
  text = escapeHtml(text).replace(/`([^`\n]+)`/g, (_, c) => '\uE100I' + (inline.push('<code>' + c + '</code>') - 1) + '\uE101');
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (all, label, href) => {
    const s = safeHref(href); return s ? '<a href="' + s + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : label;
  }).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>').replace(/(?<!_)_([^_\n]+)_(?!_)/g, '<em>$1</em>');
  const out = []; let para = [], list = '';
  const fp = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  const cl = () => { if (list) { out.push('</' + list + '>'); list = ''; } };
  for (const line of text.split('\n')) {
    const t = line.trim(), h = /^(#{1,4})\s+(.+)$/.exec(t), b = /^[-*+]\s+(.+)$/.exec(t), n = /^\d+[.)]\s+(.+)$/.exec(t);
    if (!t) { fp(); cl(); continue; }
    if (/^\uE100B\d+\uE101$/.test(t)) { fp(); cl(); out.push(t); continue; }
    if (h) { fp(); cl(); out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'); continue; }
    if (/^(---+|___+|\*\*\*+)$/.test(t)) { fp(); cl(); out.push('<hr>'); continue; }
    if (/^&gt;\s?/.test(t)) { fp(); cl(); out.push('<blockquote>' + t.replace(/^&gt;\s?/, '') + '</blockquote>'); continue; }
    if (b || n) { fp(); const w = b ? 'ul' : 'ol'; if (list !== w) { cl(); out.push('<' + w + '>'); list = w; } out.push('<li>' + (b ? b[1] : n[1]) + '</li>'); continue; }
    cl(); para.push(t);
  }
  fp(); cl();
  return out.join('').replace(/\uE100B(\d+)\uE101/g, (_, i) => blocks[+i] || '').replace(/\uE100I(\d+)\uE101/g, (_, i) => inline[+i] || '');
}
function scrollToLatest(force = false) {
  const gap = conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight;
  if (force || gap < 170) conversation.scrollTop = conversation.scrollHeight;
}
function addMessage(role, label) {
  const a = document.createElement('article'); a.className = 'message ' + role; a.setAttribute('aria-label', label);
  const b = document.createElement('div'); b.className = 'message-body glass';
  a.appendChild(b); messagesEl.appendChild(a); return { article: a, body: b };
}
function errorText(error, status) {
  if (status === 401 || status === 403) return 'Ollama rejected this API key or the account lacks access. Check secrets.js.';
  if (status === 429) return 'Ollama usage/rate limit reached. Try again later.';
  if (status === 404) return 'Ollama could not find the endpoint or model. Check the model tag in index.html.';
  if (error instanceof TypeError) return 'The browser could not reach Ollama Cloud (network or CORS). A public site needs a server-side proxy to keep the key safe.';
  return 'Ollama request failed: ' + ((error && error.message) || 'Unknown error').slice(0, 450);
}
async function sendMessage() {
  if (busy) return;
  const content = promptEl.value.trim();
  if (!content) { setStatus('Type a message first.'); promptEl.focus(); return; }
  const apiKey = sessionKey || getConfiguredKey();
  if (!apiKey) { setStatus('Add your Ollama API key to secrets.js, save, then reload.'); return; }
  busy = true; sendButton.disabled = true; promptEl.disabled = true; setStatus('');
  promptEl.value = ''; resizePrompt(); welcomeEl.classList.add('hide');
  addMessage('user', 'You').body.textContent = content; scrollToLatest(true);
  const asst = addMessage('assistant', 'Assistant');
  asst.body.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>'; scrollToLatest(true);
  const userTurn = { role: 'user', content };
  let answer = '', statusCode = 0;
  try {
    const res = await fetch(OLLAMA_ENDPOINT, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'Accept': 'application/x-ndjson, application/json' },
      body: JSON.stringify({ model: OLLAMA_MODEL, messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history, userTurn], stream: true })
    });
    statusCode = res.status;
    if (!res.ok) { const e = new Error((await res.text()).slice(0, 700) || 'HTTP ' + res.status); e.status = res.status; throw e; }
    if (!res.body || !res.body.getReader) {
      const r = await res.json(); answer = (r && r.message && r.message.content) || '';
    } else {
      const reader = res.body.getReader(), dec = new TextDecoder(); let pending = '';
      const consume = line => {
        const row = line.trim(); if (!row) return;
        let part; try { part = JSON.parse(row); } catch { throw new Error('Invalid streaming response.'); }
        if (part.error) throw new Error(String(part.error));
        const d = part.message && typeof part.message.content === 'string' ? part.message.content : '';
        if (d) { answer += d; asst.body.innerHTML = renderMarkdown(answer); scrollToLatest(); }
      };
      while (true) {
        const { value, done } = await reader.read();
        pending += dec.decode(value || new Uint8Array(), { stream: !done });
        const lines = pending.split('\n'); pending = lines.pop() || '';
        lines.forEach(consume); if (done) break;
      }
      if (pending.trim()) consume(pending);
    }
    if (!answer.trim()) throw new Error('The API completed but returned no text.');
    asst.body.innerHTML = renderMarkdown(answer);
    history.push(userTurn, { role: 'assistant', content: answer }); scrollToLatest(true);
  } catch (error) {
    asst.article.remove(); setStatus(errorText(error, error.status || statusCode)); console.error(error);
  } finally {
    busy = false; sendButton.disabled = false; promptEl.disabled = false; promptEl.focus();
  }
}
function resizePrompt() { promptEl.style.height = 'auto'; promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + 'px'; }
chatForm.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
promptEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); chatForm.requestSubmit(); } });
promptEl.addEventListener('input', resizePrompt);
document.addEventListener('keydown', e => {
  if (!e.altKey || !e.shiftKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === 'x') {
    e.preventDefault();
    if (busy) { setStatus('Wait for the current answer to finish before clearing.'); return; }
    if (messagesEl.childElementCount && confirm('Clear this conversation?')) { messagesEl.replaceChildren(); history = []; setStatus(''); welcomeEl.classList.remove('hide'); }
  }
  if (k === 'k') {
    e.preventDefault();
    const v = prompt('Enter a temporary Ollama API key for this tab (not saved):');
    if (v && v.trim()) { sessionKey = v.trim(); setStatus('Temporary key set for this tab.'); }
  }
});
</script>
