<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070b18;color:#fff;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#root{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:18px;align-items:flex-start;padding:28px max(16px,calc((100% - 780px)/2)) 20px}
#bg{position:sticky;top:0;left:0;flex:none;width:100vw;height:100dvh;margin:-28px 0 -100dvh calc(-1 * max(16px,(100vw - 780px)/2));object-fit:cover;z-index:0;pointer-events:none}
.glass{position:relative;z-index:2;max-width:100%;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.msg{padding:18px 26px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;padding:18px 34px}
.msg.assistant{width:100%}
.msg img.up{display:block;max-width:240px;max-height:240px;border-radius:14px;margin-bottom:8px}
.msg p{margin:0 0 .7em}.msg p:last-child{margin:0}
.msg h1,.msg h2,.msg h3{margin:.6em 0 .3em;font-size:1.1em}
.msg ul,.msg ol{margin:.2em 0 .7em;padding-left:1.4em}
.msg code{background:rgba(255,255,255,.15);border-radius:6px;padding:1px 6px;font-size:.9em}
.msg pre{background:rgba(0,0,0,.35);border-radius:12px;padding:12px;overflow-x:auto;margin:.4em 0 .8em}
.msg pre code{background:none;padding:0}
.msg a{color:#9ccbff}
.small{font-size:12.5px;opacity:.85;margin-top:10px}
details{margin-bottom:10px;font-size:13px;opacity:.9}summary{cursor:pointer}
.src a{display:block;margin:2px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.gallery a{display:block;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.3)}
.gallery img{width:100%;height:110px;object-fit:cover;display:block}
.gallery span{display:block;font-size:11px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:#ffc9c9;margin:0}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:1}}
#composer{position:sticky;bottom:20px;flex:none;margin-top:auto;width:100%;padding:12px 18px;z-index:5}
#preview{display:none;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
#preview.on{display:flex}#prevImg{width:48px;height:48px;object-fit:cover;border-radius:10px}
#input{width:100%;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;max-height:160px;padding:6px 4px}
#input::placeholder{color:rgba(255,255,255,.6)}
.bar{display:flex;align-items:center;gap:8px}.sp{flex:1}
button{font:inherit;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:7px 13px;cursor:pointer}
button:hover{background:rgba(255,255,255,.24)}button.on{background:#3b82f6}button.rec{background:#e5484d}
button.icon{width:38px;height:38px;padding:0;display:grid;place-items:center}svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}svg.sm{width:14px;height:14px;margin-left:4px}
button[hidden]{display:none}
.dd{position:relative}.menu{display:none;position:absolute;bottom:calc(100% + 8px);left:0;min-width:190px;background:rgba(18,22,38,.96);border-radius:14px;padding:6px;z-index:10}
.dd.open .menu{display:block}.menu button{display:block;width:100%;text-align:left;border-radius:10px;background:none}
.menu button:hover,.menu button.sel{background:rgba(255,255,255,.16)}
</style>
</head>
<body>
<div id="root">
  <img id="bg" src="city.png" alt="">
  <div id="composer" class="glass">
    <div id="preview"><img id="prevImg" alt=""><span id="prevInfo"></span><button class="icon" id="prevX" title="Remove image"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <textarea id="input" rows="1" placeholder="Message ABC123"></textarea>
    <div class="bar">
      <button class="icon" id="attach" title="Attach image"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button>
      <div class="dd" id="modelDd"><button id="modelBtn"></button><div class="menu" id="modelMenu"></div></div>
      <button id="think" hidden aria-pressed="false" title="Toggle Gemma 4 thinking"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg> Think</button>
      <div class="dd" id="effDd" hidden><button id="effBtn"></button><div class="menu" id="effMenu"></div></div>
      <span class="sp"></span>
      <button class="icon" id="mic" title="Record speech (Whisper)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="icon" id="send" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
</div>
<script type="module">
import { LiquidGlass } from "https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js";

const $ = (id) => document.getElementById(id);
const root = $("root"), composer = $("composer"), input = $("input");
const MODELS = [["granite", "Granite 4.0 H Micro"], ["gpt-oss-20b", "GPT-OSS 20B"], ["gemma-4", "Gemma 4 26B A4B"]];
const EFFORTS = [["low", "Low"], ["medium", "Medium"], ["high", "High"]];
const st = { model: "granite", think: false, effort: "medium", image: null, history: [], busy: false, rec: null };

// ---- Streamlit bridge ----
const post = (type, extra = {}) => parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
const pending = new Map();
addEventListener("message", (e) => {
  const r = e.data && e.data.type === "streamlit:render" && e.data.args && e.data.args.reply;
  if (r && pending.has(r.id)) { pending.get(r.id)(r); pending.delete(r.id); }
});
post("streamlit:componentReady", { apiVersion: 1 });
post("streamlit:setFrameHeight", { height: 600 });
const ask = (payload) => new Promise((res) => {
  const id = crypto.randomUUID();
  pending.set(id, res);
  post("streamlit:setComponentValue", { value: { id, ...payload }, dataType: "json" });
});

// ---- LiquidGlass: frosted glass config from the demo, floating off ----
const CONFIG = JSON.stringify({ cornerRadius: 40, blurAmount: 0.5, floating: false });
let lg = null, chain = Promise.resolve();
const rebuild = () => (chain = chain.then(async () => {
  if (lg) lg.destroy();
  const els = [...root.querySelectorAll(":scope > .glass")];
  els.forEach((el) => (el.dataset.config = CONFIG));
  lg = await LiquidGlass.init({ root, glassElements: els });
}).catch(console.error));

// ---- helpers ----
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nearBottom = () => root.scrollHeight - root.scrollTop - root.clientHeight < 260;
const toBottom = () => root.scrollTo(0, root.scrollHeight);
const inline = (s, sources) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\[(\d+)\]/g, (m, n) => { const s2 = sources.find((x) => x.id == n); return s2 ? `<a href="${esc(s2.url)}" target="_blank" rel="noopener">[${n}]</a>` : m; });
function markdown(text, sources) {
  const out = []; let list = null, code = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of text.split("\n")) {
    if (code !== null) { if (line.startsWith("```")) { out.push(`<pre><code>${esc(code)}</code></pre>`); code = null; } else code += (code ? "\n" : "") + line; continue; }
    if (line.startsWith("```")) { close(); code = ""; continue; }
    let m;
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1], sources)}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1], sources)}</li>`); }
    else if ((m = line.match(/^#{1,3}\s+(.*)/))) { close(); out.push(`<h3>${inline(m[1], sources)}</h3>`); }
    else if (line.trim()) { close(); out.push(`<p>${inline(line, sources)}</p>`); }
    else close();
  }
  if (code !== null) out.push(`<pre><code>${esc(code)}</code></pre>`);
  close();
  return out.join("");
}

// ---- messages ----
async function addMsg(role, html) {
  const el = document.createElement("div");
  el.className = `glass msg ${role}`;
  el.innerHTML = html;
  root.insertBefore(el, composer);
  await rebuild();
  if (role === "user" || nearBottom()) toBottom();
  return el;
}
async function showAnswer(el, r) {
  const sources = r.sources || [];
  let head = "";
  if (r.thinking || (r.activity || []).length)
    head = `<details><summary>${r.thinking ? "Thinking" : "Activity"}</summary>${(r.activity || []).map((a) => `<div>• ${esc(a)}</div>`).join("")}${r.thinking ? `<div>${esc(r.thinking).replace(/\n/g, "<br>")}</div>` : ""}</details>`;
  el.innerHTML = head + `<div class="body"></div>`;
  const body = el.querySelector(".body"), words = r.answer.split(/(\s+)/);
  for (let i = 0; i < words.length; i += 6) {
    body.innerHTML = markdown(words.slice(0, i + 6).join(""), sources);
    if (nearBottom()) toBottom();
    await new Promise((res) => setTimeout(res, 20));
  }
  body.innerHTML = markdown(r.answer, sources);
  if ((r.images || []).length)
    el.insertAdjacentHTML("beforeend", `<div class="gallery">${r.images.map((i) => `<a href="${esc(i.page_url || i.image_url)}" target="_blank" rel="noopener"><img src="${esc(i.image_url)}" alt="${esc(i.title)}" loading="lazy"><span>${esc(i.title)}</span></a>`).join("")}</div>`);
  if (sources.length)
    el.insertAdjacentHTML("beforeend", `<div class="small src"><b>Sources</b>${sources.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">[${s.id}] ${esc(s.title)}</a>`).join("")}</div>`);
  if (nearBottom()) toBottom();
}

async function send() {
  const text = input.value.trim();
  if (st.busy || (!text && !st.image)) return;
  st.busy = true;
  const image = st.image;
  input.value = ""; autosize(); clearImage();
  st.history.push({ role: "user", content: text, images: image ? [image.url] : [] });
  await addMsg("user", (image ? `<img class="up" src="${image.url}" alt="">` : "") + (text ? `<p>${esc(text)}</p>` : ""));
  const el = await addMsg("assistant", `<span class="dots"><i></i><i></i><i></i></span>`);
  const r = await ask({ action: "chat", messages: st.history.slice(-20), model: st.model, think: st.think, effort: st.effort });
  if (r.error) { el.innerHTML = `<p class="err">${esc(r.error)}</p>`; st.history.pop(); }
  else { await showAnswer(el, r); st.history.push({ role: "assistant", content: r.answer }); st.history.forEach((m, i) => { if (i < st.history.length - 2) m.images = []; }); }
  st.busy = false;
}

// ---- composer controls ----
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("send").onclick = send;

function dropdown(dd, btn, menu, items, get, set) {
  const draw = () => { btn.innerHTML = esc(items.find((i) => i[0] === get())[1]) + `<svg class="sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`; menu.innerHTML = ""; items.forEach(([k, l]) => { const b = document.createElement("button"); b.textContent = l; b.className = k === get() ? "sel" : ""; b.onclick = () => { set(k); dd.classList.remove("open"); sync(); }; menu.append(b); }); };
  btn.onclick = (e) => { e.stopPropagation(); document.querySelectorAll(".dd.open").forEach((d) => d !== dd && d.classList.remove("open")); dd.classList.toggle("open"); };
  return draw;
}
const drawModel = dropdown($("modelDd"), $("modelBtn"), $("modelMenu"), MODELS, () => st.model, (k) => (st.model = k));
const drawEff = dropdown($("effDd"), $("effBtn"), $("effMenu"), EFFORTS, () => st.effort, (k) => (st.effort = k));
function sync() {
  drawModel(); drawEff();
  $("think").hidden = st.model !== "gemma-4";
  $("effDd").hidden = st.model !== "gpt-oss-20b";
  $("think").classList.toggle("on", st.think);
  $("think").setAttribute("aria-pressed", st.think);
}
$("think").onclick = () => { st.think = !st.think; sync(); };
document.addEventListener("click", () => document.querySelectorAll(".dd.open").forEach((d) => d.classList.remove("open")));
sync();

// ---- image attach + compressor ----
function clearImage() { st.image = null; $("preview").classList.remove("on"); $("file").value = ""; }
$("attach").onclick = () => $("file").click();
$("prevX").onclick = clearImage;
$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const bmp = await createImageBitmap(f), k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.72);
  st.image = { url };
  $("prevImg").src = url;
  $("prevInfo").textContent = `${f.name} · ${(f.size / 1024).toFixed(0)} KB → ${(url.length * 0.75 / 1024).toFixed(0)} KB`;
  $("preview").classList.add("on");
};

// ---- microphone (Whisper) ----
$("mic").onclick = async () => {
  if (st.rec) { st.rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); st.rec = null; $("mic").classList.remove("rec");
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      const b64 = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
      $("mic").disabled = true;
      const r = await ask({ action: "transcribe", audio_base64: b64, audio_mime: blob.type });
      $("mic").disabled = false;
      if (r.transcript) { input.value = (input.value + " " + r.transcript).trim(); autosize(); }
      else if (r.error) alert(r.error);
    };
    rec.start(); st.rec = rec; $("mic").classList.add("rec");
  } catch (err) { alert("Microphone unavailable: " + err.message); }
};

await rebuild();
</script>
</body>
</html>
